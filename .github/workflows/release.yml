name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger
    inputs:
      tag_name:
        description: 'Release tag (e.g., v1.0.0)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel
      
      - name: Extract version and update __init__.py
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}
          else
            # Manual dispatch: use input tag_name
            TAG_NAME="${{ inputs.tag_name }}"
            VERSION=${TAG_NAME#v}
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Update __init__.py with the extracted version (single source of truth)
          sed -i.bak "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" src/meltr/__init__.py
          rm src/meltr/__init__.py.bak
          echo "Updated src/meltr/__init__.py version to $VERSION"
      
      - name: Build package
        run: |
          python -m build
      
      - name: Build Linux x86_64 .tgz bundle
        run: |
          bash scripts/build_linux_tgz.sh "${{ steps.version.outputs.version }}"
      
      - name: Smoke test Linux bundle
        run: |
          set -euo pipefail
          TGZ="dist/logforge-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz"
          test -f "$TGZ"
          D=$(mktemp -d)
          tar xzf "$TGZ" -C "$D"
          B="$D/logforge"
          test -x "$B/app/bin/meltr"
          export PATH="$B/app/bin:$PATH"
          logforge --version
          logforge init --directory "$D/lfhome" --force
          test -f "$D/lfhome/config.yaml"
      
      - name: Create checksums
        run: |
          cd dist
          shopt -s nullglob
          FILES=( *.whl *.tar.gz *.sha256 )
          sha256sum "${FILES[@]}" | sort -k2 > checksums.txt
      
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sha256
            dist/checksums.txt
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag_name, 'alpha') || contains(steps.version.outputs.tag_name, 'beta') || contains(steps.version.outputs.tag_name, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
