name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual trigger
    inputs:
      tag_name:
        description: 'Release tag (e.g., v1.0.0)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Extract version and update __init__.py
        id: version
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          # GITHUB_REF is set by the runner; INPUT_TAG_NAME via env (never interpolate github.* in run:)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}
          else
            TAG_NAME="$INPUT_TAG_NAME"
            VERSION=${TAG_NAME#v}
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # PEP 440 pre-releases: 2.0.0a1 / 2.0.0b1 / 2.0.0rc1 and spelled-out forms
          if [[ "$VERSION" =~ (a|b|rc|alpha|beta)[0-9]*$ ]] || [[ "$VERSION" =~ \.(a|b|rc|alpha|beta) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          # Update __init__.py with the extracted version (single source of truth)
          sed -i.bak "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" src/meltr/__init__.py
          rm src/meltr/__init__.py.bak
          echo "Updated src/meltr/__init__.py version to $VERSION"

      - name: Build package
        run: |
          python -m build

      - name: Build Linux x86_64 .tgz bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/build_linux_tgz.sh "$VERSION"

      - name: Smoke test Linux bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TGZ="dist/meltr-${VERSION}-linux-x86_64.tar.gz"
          test -f "$TGZ"
          D=$(mktemp -d)
          tar xzf "$TGZ" -C "$D"
          B="$D/meltr"
          test -x "$B/app/bin/meltr"
          export PATH="$B/app/bin:$PATH"
          meltr --version
          meltr init --directory "$D/lfhome" --force
          test -f "$D/lfhome/config.yaml"

      - name: Create checksums
        run: |
          cd dist
          shopt -s nullglob
          FILES=( *.whl *.tar.gz *.sha256 )
          sha256sum "${FILES[@]}" | sort -k2 > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sha256
            dist/checksums.txt
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
