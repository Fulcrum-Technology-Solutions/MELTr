[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meltr"
dynamic = ["version"]
description = "Synthetic event log generator with template-based architecture"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "John Owen", email = "john@ftsc.com"}]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "jinja2>=3.1.6",
    "pyyaml>=6.0.3",
    "typer>=0.27.0",
    "requests>=2.34.2",
    "python-dateutil>=2.9.0.post0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.51.0",
    "prometheus-client>=0.19.0",
    "pydantic>=2.13.4",
    "faker>=40.28.1",
    "rich>=15.0.0",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
dev = [
    "pip-licenses>=5.5.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "black>=26.5.1",
    "ruff>=0.15.22",
    "mypy>=2.3.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
]

[project.scripts]
meltr = "meltr.cli.main:main"
logforge = "meltr.cli.main:main"  # compat alias during LogForge → MELTr transition

[project.urls]
Homepage = "https://github.com/Fulcrum-Technology-Solutions/MELTr"
Documentation = "https://github.com/Fulcrum-Technology-Solutions/MELTr#readme"
Repository = "https://github.com/Fulcrum-Technology-Solutions/MELTr.git"
Issues = "https://github.com/Fulcrum-Technology-Solutions/MELTr/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "meltr.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meltr = ["data/*.yaml"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise-from inside except — widespread HTTPException/CLI pattern; fix later
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--cov=meltr",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=60",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/meltr/cli/entities_editor.py",
    "*/meltr/cli/api.py",
    "*/meltr/cli/user_utils.py",
    "*/meltr/service.py",
    "*/meltr/cli/entities.py",
    "*/meltr/cli/menu.py",
    "*/meltr/cli/templates.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
