# LogForge Production Configuration
# This config outputs to STDOUT for easy testing and monitoring

version: "1.0"

# Engine settings
engine:
  max_generators: null  # null = unlimited based on CPU
  thread_pool_size: null  # null = auto (cores × 5)
  log_level: INFO

# API server settings
api:
  enabled: true
  host: 127.0.0.1
  port: 8080
  auth:
    enabled: false
    key: null

# Entity registry settings
entity_registry:
  path: ${LOGFORGE_HOME}/entities.yaml
  auto_save: true
  save_interval: 60
  backup_enabled: true
  backup_count: 3

# Template settings
templates:
  local_path: ${LOGFORGE_HOME}/templates
  default_path: ${LOGFORGE_HOME}/templates/default
  custom_path: ${LOGFORGE_HOME}/templates/custom
  precedence: custom_first
  community_api_url: https://logforge.io/api/v1
  auto_update_check: true
  cache_ttl: 3600
  auto_backup_on_customize: true
  diff_tool: auto

# Logging settings
logging:
  level: INFO
  file: ${LOGFORGE_HOME}/logforge.log
  rotation:
    max_size: 52428800  # 50MB
    backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Output handler settings
outputs:
  retry:
    max_attempts: -1  # -1 = unlimited retries
    retry_interval: 5  # seconds
    backoff_multiplier: 2.0
    max_backoff: 300  # max 5 minutes
  buffer_size: 10000
  
  # Output definitions
  definitions:
    # Console output to STDOUT (JSON format)
    - name: stdout
      type: console
      stream: stdout
      format: json
    
    # Alternative: File output with templating and rotation
    # Uncomment to use file output instead of console
    # Path template supports variables:
    #   {generator}, {generator_name} - Generator name
    #   {vendor}, {product}, {data_source} - Template metadata
    #   {date}, {year}, {month}, {day}, {hour} - Time variables
    #   {timestamp} - Unix timestamp
    #   {output_name} - Output handler name
    #   {organization_name} - Organization from entity registry
    #   ${LOGFORGE_HOME} - LOGFORGE_HOME directory
    #   ${VAR} - Any environment variable
    #
    # Example 1: Organized by vendor/product with date
    # - name: file-output
    #   type: file
    #   path: ${LOGFORGE_HOME}/outputs/{vendor}/{product}/{generator}-{date}.log
    #   rotation:
    #     type: size
    #     max_size: 104857600  # 100MB
    #     max_files: 10  # Keep last 10 rotated files
    #     compress: true
    #
    # Example 2: Simple path (backward compatible)
    # - name: file-output-simple
    #   type: file
    #   path: ${LOGFORGE_HOME}/outputs/events.log
    #   rotation:
    #     type: size
    #     max_size: 104857600
    #     compress: true
    #
    # Example 3: Hourly rotation with time-based path
    # - name: file-output-hourly
    #   type: file
    #   path: ${LOGFORGE_HOME}/outputs/{vendor}/{product}/{date}/{generator}-{hour}.log
    #   rotation:
    #     type: time
    #     max_age: 24h  # Rotate after 24 hours
    #     max_files: 7  # Keep last 7 days
    #     compress: true

# Generator definitions
# Add your template IDs here to generate events
generators:
  # Example generator - replace with your actual template IDs
  # Template ID format: vendor/product/category/template_name
  # Example: microsoft/windows/system/clop_persistence
  
  # - name: windows-login-success
  #   template: microsoft/windows/system/clop_persistence
  #   enabled: true
  #   # Frequency is read from template metadata (.meta.yaml)
  #   # To customize, copy template to custom/ directory and edit .meta.yaml
  #   outputs:
  #     - stdout
  
  # - name: paloalto-wildfire-threats
  #   template: paloalto/wildfire/threats/wildfire_threat_detected
  #   enabled: true
  #   # Frequency is read from template metadata (.meta.yaml)
  #   # To customize, copy template to custom/ directory and edit .meta.yaml
  #   outputs:
  #     - stdout

