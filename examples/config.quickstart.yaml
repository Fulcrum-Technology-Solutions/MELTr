# MELTr Quick Start Configuration
# Minimal config for immediate testing - outputs to STDOUT

version: "1.0"

engine:
  log_level: INFO

api:
  enabled: true
  host: 127.0.0.1
  port: 8080

entity_registry:
  path: ${MELTR_HOME}/entities.yaml
  auto_save: true

templates:
  local_path: ${MELTR_HOME}/templates
  default_path: ${MELTR_HOME}/templates/default
  custom_path: ${MELTR_HOME}/templates/custom

logging:
  level: INFO
  file: ${MELTR_HOME}/meltr.log

outputs:
  definitions:
    - name: stdout
      type: console
      stream: stdout
      format: json
    
    # Optional: File output with templating
    # Uncomment to write to files instead of (or in addition to) console
    # Path template supports variables: {generator}, {vendor}, {product}, {data_source}, {date}, {timestamp}, etc.
    #
    # Example: Organized by vendor/product
    # - name: file-output
    #   type: file
    #   path: ${MELTR_HOME}/outputs/{vendor}/{product}/{generator}-{date}.log
    #   rotation:
    #     type: size
    #     max_size: 104857600  # 100MB
    #     max_files: 5
    #     compress: true
    #
    # Example: Simple single file (backward compatible)
    # - name: file-output-simple
    #   type: file
    #   path: ${MELTR_HOME}/outputs/events.log
    #   rotation:
    #     type: size
    #     max_size: 104857600
    #     compress: true

# Add your generators here - just uncomment and set your template ID
generators:
  # Example: Uncomment and customize
  # - name: my-generator
  #   template: vendor/product/category/template_name
  #   enabled: true
  #   # Optional: Override timezone (defaults to organization timezone from entities.yaml)
  #   # timezone: America/New_York
  #   # Frequency is read from template metadata (.meta.yaml)
  #   # To customize, copy template to custom/ directory and edit .meta.yaml
  #   outputs:
  #     - stdout

