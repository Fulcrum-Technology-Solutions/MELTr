# LogForge Quick Start Configuration
# Minimal config for immediate testing - outputs to STDOUT

version: "1.0"

engine:
  log_level: INFO

api:
  enabled: true
  host: 127.0.0.1
  port: 8080

entity_registry:
  path: ${LOGFORGE_HOME}/entities.yaml
  auto_save: true

templates:
  local_path: ${LOGFORGE_HOME}/templates
  default_path: ${LOGFORGE_HOME}/templates/default
  custom_path: ${LOGFORGE_HOME}/templates/custom

logging:
  level: INFO
  file: ${LOGFORGE_HOME}/logforge.log

outputs:
  definitions:
    - name: stdout
      type: console
      stream: stdout
      format: json

# Add your generators here - just uncomment and set your template ID
generators:
  # Example: Uncomment and customize
  # - name: my-generator
  #   template: vendor/product/category/template_name
  #   enabled: true
  #   frequency:
  #     base_rate: 0.1  # events per second
  #   outputs:
  #     - stdout

